##                          ##
##         BlueMap          ##
##      Plugin-Config       ##
##                          ##

# If the server should send player positions to the webapp.
# This only works if the integrated webserver is enabled.
# Default is true
live-player-markers: true

# The interval in milliseconds in which the server samples the players positions and
# the webapp requests them. Lower values result in smoother player movement on the map,
# but cause more requests to the webserver.
# Values are clamped between 50 and 10000.
# Default is 250
live-player-update-interval: 250

# If this is true, additional player-data is sent to the webapp:
# body-rotation, velocity, the dimension, movement-states (sneaking, sprinting, on-ground, swimming, flying)
# and a counter that changes when a player teleports.
# This is used to display and animate player-models, but also makes player-movements more traceable.
# If this is false, only the name, position and rotation of the players are sent (like before).
# Default is true
live-player-extended-data: true

# A list of gamemodes that will prevent a player from appearing on the map.
# Possible values are: survival, creative, spectator or adventure.
hidden-game-modes: [
  "spectator"
]

# If this is true, players that are vanished (by a plugin) will be hidden on the map.
# (This only works with Spigot and Sponge based vanish plugins).
# Default is true
hide-vanished: true

# If this is true, players that have an invisibility (potion-)effect will be hidden on the map.
# Default is true
hide-invisible: true

# If this is true, players that are sneaking will be hidden on the map.
# Default is false
hide-sneaking: false

# Hides the player if they are in a sky (or block) light level below the given number.
# BOTH values have to be below the threshold for the player to be hidden!
# E.g. if you set both to 1, then the player will be hidden on the map if they are in absolute darkness.
# Or, if you want players only be visible on the surface, then set the sky threshold to something between
# 1 and 15 and the block threshold to 16.
# Default is 0 (don't hide the player).
hide-below-sky-light: 0
hide-below-block-light: 0

# If this is true, players that are on a different world than the viewed map will not appear on the player list.
# Default is false
hide-different-world: false

# The interval in seconds at which the markers will be written to the map storage.
# This is useful if you can't create a live connection between the server and the webapp
# and the markers can only be updated via the map storage.
# 0 or lower means that the markers will never be written to the map storage.
# Default is 0
#write-markers-interval: 10

# The interval in seconds at which the players will be written to the map storage.
# This is useful if you can't create a live connection between the server and the webapp
# and the players can only be updated via the map storage.
# 0 or lower means that the players will never be written to the map storage.
# Default is 0
#write-players-interval: 3

# Download the skin from mojang servers when a player joins your server, so it can be used for the player markers
# (head-icon) and the 3d player-models (full skin). A skin is downloaded at most once per hour per player.
# If this is false, no skins are downloaded at all. Skins that have been downloaded before stay in the map-storage
# and are still used, players without a stored skin are shown with the default skin.
# Default is true
skin-download: true

# BlueMap Live: if the entities around the players (dropped items, arrows, thrown items, ...) are shown on the map.
# Only entities around players that are shown on the map are sent (hidden players are not revealed).
# Default is true
live-entities: true

# The radius in blocks around the players in which entities are shown.
# Values are clamped between 0 and 128.
# Default is 30
live-entities-radius: 30

# The maximum amount of entities that are sent to the webapp per map (the nearest first).
# Values are clamped between 0 and 1000.
# Default is 200
live-entities-limit: 200

# A list of entity-types that are never shown, e.g. [ "minecraft:item", "minecraft:arrow" ]
# Default is empty
live-entities-hidden-types: []

# BlueMap Live: if block-changes appear on the map within seconds.
# Minecraft saves changed chunks on its own (at most every 10 seconds per chunk), BlueMap renders the changed tiles
# again after the cooldown below, and the webapp reloads them without reloading the page.
# Default is true
live-block-updates: true

# BlueMap Live: if block-changes are shown at once as a preview (placed and removed blocks, explosions, pistons, ...),
# until BlueMap rendered the tile again (then the rendered tile is shown; a preview that is not confirmed by a render
# within 90 seconds is discarded). Needs live-block-updates.
# Default is true
live-block-preview: true

# The radius in blocks around the shown players in which block-changes are previewed.
# Values are clamped between 0 and 256.
# Default is 96
live-block-preview-radius: 96

# While live-block-updates are on, a region is rendered again at the earliest after this many seconds
# (instead of the longer default update-cooldown of 60 seconds).
# Default is 10
live-block-update-cooldown: 10

# The amount of players that is needed to pause BlueMap's render threads.
# If this amount of players or more is online, BlueMap will stop rendering map updates until enough players have logged off again.
# Setting this to 0 or -1 will disable this feature, which means BlueMap will not pause rendering.
# Default is -1
player-render-limit: -1

# The interval in minutes at which a full map update will be triggered.
# This is IN ADDITION to the normal map update process (in case that fails to detect any file changes).
# ! This DOESN'T re-render the entire map each time, it only checks if there are some changes that have not been rendered yet!
# Default is 1440 (24 hours).
full-update-interval: 1440
