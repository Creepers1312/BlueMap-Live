name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # needed for versioning
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Tests
        run: ./gradlew spotlessCheck test --stacktrace 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      # BlueMap Live: the differences of the webapp mob-models to vanilla (if any) as annotations
      - name: Vanilla model check
        if: always()
        run: cat implementations/fabric/build/vanilla-model-check.txt 2>/dev/null || true
      # BlueMap Live: the reason of a failed test-run as annotation (the failures from the junit-reports)
      - name: Test failures
        if: failure()
        run: |
          for f in $(grep -l -E "<failure|<error" */build/test-results/test/*.xml implementations/*/build/test-results/test/*.xml 2>/dev/null); do
            grep -E "message=|Caused by|Exception:|Error:" "$f" | sort -u | head -30 | \
              sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }' | sed "s|^|::error title=$(basename $f)::|"; echo
            grep -E "ERROR|WARN|Exception|Incompatible|requires|Mod resolution" "$f" | head -30 | \
              sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }' | sed "s|^|::error title=log $(basename $f)::|"; echo
          done
          grep -E "FAILED|initializationError" test-output.txt | grep -v buildSrc | head -10 | sed 's/^/::warning title=gradle::/' || true

  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: write # BlueMap Live: attach the jar to the github-release of a version-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # needed for versioning
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew release --stacktrace
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/release/*
      # BlueMap Live: version-tags (v...) of the fork get the fabric-jar attached to their github-release
      # (the release is created as pre-release if it does not exist yet)
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Creepers1312/BlueMap-Live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --prerelease --title "BlueMap Live $GITHUB_REF_NAME" --notes "BlueMap Live $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" build/release/*-fabric*.jar --clobber

  docker:
    name: Deploy Docker Build
    # only publish images from the original repository (BlueMap Live does not publish docker images)
    if: github.repository == 'BlueMap-Minecraft/BlueMap'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: artifacts
          path: build/release
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Always tagged as the pushed branch (ex. master)
          # For releases: latest, full version and major version (ex. latest, v3.3 and v3)
          tags: |
            type=raw,value={{branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=v\d+,group=0,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=false
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
