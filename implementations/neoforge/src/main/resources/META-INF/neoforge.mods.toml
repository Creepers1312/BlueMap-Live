modLoader="javafml"
loaderVersion="[${loader_version},)"
license="MIT"

[[mods]]
modId="bluemap"
version="${version}"
displayName="BlueMap Live"
description='''BlueMap Live: an unofficial fork of BlueMap that shows the world live on the 3d-map: players, mobs, items, effects, block-changes, time and weather. A 3d-map of your Minecraft worlds view-able in your browser using three.js (WebGL)'''
displayTest="IGNORE_SERVER_VERSION"

# BlueMap Live: the mixin for the block-changes
[[mixins]]
config="bluemap_live.mixins.json"

[[dependencies.bluemap]]
    modId="neoforge"
    mandatory=true
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.bluemap]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},1.21.2)"
    ordering="NONE"
    side="BOTH"
